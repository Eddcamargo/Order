<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Controle de Produção - Menu</title>
  <link rel="stylesheet" href="/Public/style.css">
</head>
<body>

  <div class="theme-switch-wrapper">
    <label class="switch">
      <input id="theme-checkbox" type="checkbox" />
      <span class="slider">
        <div class="star star_1"></div>
        <div class="star star_2"></div>
        <div class="star star_3"></div>
        <svg viewBox="0 0 16 16" class="cloud_1 cloud">
          <path
            transform="matrix(.77976 0 0 .78395-299.99-418.63)"
            fill="#fff"
            d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
          ></path>
        </svg>
      </span>
    </label>
  </div>

  <div id="login-section" class="container">
    <h2>Acesso ao Sistema</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>

  <div id="menu-section" class="container hidden">
    <h2>Menu Principal</h2>
    <div class="user-info" id="user-display">Carregando usuário...</div>
    <div class="menu-layout">
      <button id="btn-goto-dashboard" class="btn-menu btn-dashboard hidden">📊 Dashboard de Monitoramento</button>
      <button id="btn-goto-novo-pedido" class="btn-menu btn-pedido hidden">➕ Planejar Novo Pedido</button>
      <button id="btn-goto-expedicao" class="btn-menu btn-expedicao hidden">📦 Expedição</button>
      <button id="btn-goto-producao" class="btn-menu btn-producao hidden">🏭 Produção</button>
    </div>
    <button class="btn-logout">Sair do Sistema</button>
  </div>

  <script src="/Public/order.js"></script>
  
  <script>
    const themeCheckbox = document.getElementById('theme-checkbox');
    
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      if (themeCheckbox) themeCheckbox.checked = true;
    } else {
      document.body.classList.remove('light-mode');
      if (themeCheckbox) themeCheckbox.checked = false;
    }

    if (themeCheckbox) {
      themeCheckbox.addEventListener('change', () => {
        if (themeCheckbox.checked) {
          document.body.classList.add('light-mode');
          localStorage.setItem('theme', 'light');
        } else {
          document.body.classList.remove('light-mode');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
  </script>
</body>
</html>
