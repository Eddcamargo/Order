<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Linha de Produção — Scanner Worker</title>
  <link rel="stylesheet" href="/public/style.css">
  <script src="/public/producao.js"></script>
</head>
<body>

  <div class="theme-switch-wrapper">
    <label class="switch">
      <input id="theme-checkbox" type="checkbox" />
      <span class="slider">
        <div class="star star_1"></div>
        <div class="star star_2"></div>
        <div class="star star_3"></div>
        <svg viewBox="0 0 16 16" class="cloud_1 cloud">
          <path
            transform="matrix(.77976 0 0 .78395-299.99-418.63)"
            fill="#fff"
            d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
          ></path>
        </svg>
      </span>
    </label>
  </div>

  <div class="production-container">
    <div class="header-box">
      <h1>🏭 Produção</h1>
    </div>

    <div class="form-group">
      <label for="production-order-select">Ordem de Produção Ativa:</label>
      <select id="production-order-select">
        <option value="">Carregando ordens ativas...</option>
      </select>
    </div>

    <div class="scan-zone">
      <label for="production-scan-input"> Clique na caixa abaixo e escaneie o Código </label>
      <div class="scan-input-wrapper">
        <input
          type="text"
          id="production-scan-input"
          class="scan-input"
          placeholder="Aguardando leitura do leitor..."
          autocomplete="off"
        >
      </div>
      <button id="btn-submit-production-scan" class="btn-submit">Confirmar Entrada</button>
    </div>

    <div id="production-feedback"></div>

    <!-- Progresso do pedido escaneado — espelha o estilo do dashboard -->
    <div id="production-progress" class="progress-section hidden">
      <h3 class="progress-section-title">Progresso do Pedido</h3>
      <div class="progress-order-info">
        <span id="progress-order-label" class="progress-order-label"></span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="progress-counts" class="progress-counts-text"></div>
    </div>

    <!-- Log de leituras recentes da sessão atual -->
    <div id="scan-log-section" class="scan-log-section hidden">
      <h3 class="scan-log-title">Últimas Leituras</h3>
      <div id="scan-log-list" class="scan-log-list"></div>
    </div>

    <div class="exit-row">
      <a href="/public/order.html" class="btn-exit">⬅ Sair</a>
    </div>
  </div>

  <script>
    const themeCheckbox = document.getElementById('theme-checkbox');

    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      if (themeCheckbox) themeCheckbox.checked = true;
    } else {
      document.body.classList.remove('light-mode');
      if (themeCheckbox) themeCheckbox.checked = false;
    }

    if (themeCheckbox) {
      themeCheckbox.addEventListener('change', () => {
        if (themeCheckbox.checked) {
          document.body.classList.add('light-mode');
          localStorage.setItem('theme', 'light');
        } else {
          document.body.classList.remove('light-mode');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
  </script>
</body>
</html>
