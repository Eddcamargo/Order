<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Produção</title>
 <link rel="stylesheet" href="/Public/style.css">
</head>
<body>
  <div class="theme-switch-wrapper">
    <label class="switch">
      <input id="theme-checkbox" type="checkbox" />
      <span class="slider">
        <div class="star star_1"></div>
        <div class="star star_2"></div>
        <div class="star star_3"></div>
        <svg viewBox="0 0 16 16" class="cloud_1 cloud">
          <path
            transform="matrix(.77976 0 0 .78395-299.99-418.63)"
            fill="#fff"
            d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
          ></path>
        </svg>
      </span>
    </label>
  </div>

  <div class="dashboard-container">
    <div class="header-box">
      <h1>📊 Dashboard de Controle de Pedidos Ativos</h1>
      <a href="/Public/order.html" class="btn-back">⬅ Voltar ao Menu</a>
    </div>

    <div class="cards-grid">
      <div class="card card-total">
        <div>Pedidos em Produção</div>
        <div id="count-total" class="card-val">0</div>
      </div>
      <div class="card card-alerta">
        <div>Entregas Próximas</div>
        <div id="count-alerta" class="card-val">0</div>
      </div>
      <div class="card card-atrasado">
        <div>Pedidos Atrasados</div>
        <div id="count-atrasado" class="card-val">0</div>
      </div>
    </div>

    <table>
      <thead>
          <tr>
            <th style="width: 5%;">Pedido</th>
            <th style="width: 20%;">Cliente</th>
            <th style="width: 15%;">Descrição</th>
            <th style="width: 35%;">Progresso da Produção</th> <th style="width: 12%;">Data Entrega</th>
            <th style="width: 8%;">Status</th>
            <th style="width: 5%;">Ações</th>
          </tr>
        </thead>
      <tbody id="dashboard-tbody"></tbody>
    </table>
  </div>

  <script src="/Public/dashboard.js"></script>

  <script>
    const themeCheckbox = document.getElementById('theme-checkbox');
    
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      if (themeCheckbox) themeCheckbox.checked = true;
    } else {
      document.body.classList.remove('light-mode');
      if (themeCheckbox) themeCheckbox.checked = false;
    }

    if (themeCheckbox) {
      themeCheckbox.addEventListener('change', () => {
        if (themeCheckbox.checked) {
          document.body.classList.add('light-mode');
          localStorage.setItem('theme', 'light');
        } else {
          document.body.classList.remove('light-mode');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
  </script>
</body>
</html>
